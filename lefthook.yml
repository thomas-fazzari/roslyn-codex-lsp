pre-commit:
  jobs:
    - name: csharp-format
      glob:
        - "{src,tests}/**/*.{cs,csx,csproj,props,targets,xml,config,resx}"
        - "*.{props,targets,slnx}"
      run: dotnet tool run csharpier format {staged_files}
      stage_fixed: true

    - name: markdown
      glob: "{*.md,docs/**/*.md,skills/**/*.md}"
      group:
        jobs:
          - run: bun run oxfmt --write {staged_files}
            stage_fixed: true
          - run: bun run markdownlint-cli2 --config .markdownlint-cli2.jsonc --no-globs --fix {staged_files}
            stage_fixed: true

    - name: json-format
      glob: "{*.json,.*.json,.*.jsonc,.config/**/*.json,.vscode/**/*.json,eng/**/*.mjs}"
      run: bun run oxfmt --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: just tooling::check backend::lint backend::test
