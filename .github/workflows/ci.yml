name: Build and release

on:
  push:
    branches: [master, feature/**, chore/**, fix/**, hotfix/**]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: just install
      - run: just backend::lint docs::check tooling::check

  native:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: RoslynCodexLsp
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            executable: RoslynCodexLsp
          - os: macos-26-intel
            rid: osx-x64
            executable: RoslynCodexLsp
          - os: macos-latest
            rid: osx-arm64
            executable: RoslynCodexLsp
          - os: windows-latest
            rid: win-x64
            executable: RoslynCodexLsp.exe
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ID: ${{ matrix.rid }}
      EXECUTABLE: ${{ matrix.executable }}
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Install native build tools
        run: bash eng/ci/setup.sh
      - name: Set binary version
        run: just ci::version
      - name: Run unit tests
        run: just test
      - name: Publish native executable
        run: just backend::publish
      - name: Install Roslyn for integration tests
        run: just ci::roslyn
      - name: Test native executable against Roslyn
        env:
          ROSLYN_CODEX_TEST_EXECUTABLE: ${{ github.workspace }}/artifacts/native/${{ matrix.executable }}
        run: just test-integration
      - name: Package native executable
        run: just ci::package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [formatting, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: just ci::release
