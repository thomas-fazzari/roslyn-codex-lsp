name: Deploy documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - package.json
      - bun.lock
      - justfile
      - eng/common.just
      - eng/docs.just
      - eng/tooling.just
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/configure-pages@v6.0.0
      - run: just tooling::install
      - run: just docs::build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
